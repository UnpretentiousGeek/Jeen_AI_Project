services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: jeen
      POSTGRES_USER: jeen
      POSTGRES_PASSWORD: jeen_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeen -d jeen"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - jeen_postgres_data:/var/lib/postgresql/data
      - ./db:/workspace/db:ro

volumes:
  jeen_postgres_data:

